<app-dashboard-util
  (addUser)="openEdit()"
  [searchTerm]="query.search || ''"
  [sortBy]="query.sortBy || 'name'"
  [sortDir]="query.sortDir || 'asc'"
  (searchChange)="onSearchChange($event)"
  (sortByChange)="onSortByChange($event)"
  (sortDirChange)="onSortDirChange($event)"
></app-dashboard-util>

<div class="bg-white flex flex-col px-3 rounded-xl">
  <div class="p-3">
    <div class="flex items-center justify-between">
      <div>List Users</div>
    </div>
  </div>
  <div class="table-header flex px-3 py-2 border-t border-b">
    @for (col of tableCols; track $index) {
      <div [style.width]="col.width" class="font-semibold">{{ col.name }}</div>
    }
  </div>

  @for (user of users; track $index) {
    <div class="flex flex-row items-center px-3 py-2 gap-2 w-full hover:bg-gray-50">
      <div [style.width]="tableCols[0].width" class="flex justify-between items-center">
        <div>
          <div class="font-medium">{{ user.firstName }} {{ user.lastName }}</div>
          <div class="text-sm text-gray-500">{{ user.email }}</div>
        </div>
        <div class="mx-12 bg-[#0095FF] text-white px-2 py-1 rounded-lg">{{user.role?.roleName}}</div>
      </div>
      <div [style.width]="tableCols[1].width">{{ user.createdDate | date:'dd/MM/yyyy' }}</div>
      <div [style.width]="tableCols[2].width">
        <button class="icon-btn" title="Edit" (click)="openEdit(user)">
          <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 16 16" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M15.502 1.94a.5.5 0 010 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 01.707 0l1.293 1.293zm-1.75 2.456l-2-2L4.939 9.21a.5.5 0 00-.121.196l-.805 2.414a.25.25 0 00.316.316l2.414-.805a.5.5 0 00.196-.12l6.813-6.814z"></path><path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 002.5 15h11a1.5 1.5 0 001.5-1.5v-6a.5.5 0 00-1 0v6a.5.5 0 01-.5.5h-11a.5.5 0 01-.5-.5v-11a.5.5 0 01.5-.5H9a.5.5 0 000-1H2.5A1.5 1.5 0 001 2.5v11z" clip-rule="evenodd"></path></svg>
        </button>
        <button class="icon-btn delete" title="Delete" (click)="onDelete(user)">
          <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 16 16" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M5.5 5.5A.5.5 0 016 6v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm2.5 0a.5.5 0 01.5.5v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm3 .5a.5.5 0 00-1 0v6a.5.5 0 001 0V6z"></path><path fill-rule="evenodd" d="M14.5 3a1 1 0 01-1 1H13v9a2 2 0 01-2 2H5a2 2 0 01-2-2V4h-.5a1 1 0 01-1-1V2a1 1 0 011-1H6a1 1 0 011-1h2a1 1 0 011 1h3.5a1 1 0 011 1v1zM4.118 4L4 4.059V13a1 1 0 001 1h6a1 1 0 001-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z" clip-rule="evenodd"></path></svg>
        </button>
      </div>
    </div>
  }

  <div class="flex items-center justify-between px-3 py-3 border-t">
    <div class="flex items-center gap-2">
      <span class="text-sm text-gray-600">Items per page</span>
      <select
        class="border rounded px-2 py-1 bg-white"
        [value]="query.pageSize || 6"
        (change)="onPageSizeChange($any($event.target).value)"
      >
        <option [value]="6">6</option>
        <option [value]="10">10</option>
        <option [value]="20">20</option>
        <option [value]="50">50</option>
      </select>
    </div>
    <div class="flex items-center gap-3">
      <button class="bg-white border px-3 py-1 rounded disabled:opacity-50" (click)="onPrevPage()" [disabled]="(query.page || 1) <= 1">
        Prev
      </button>
      <span class="text-sm text-gray-600">Page {{ query.page || 1 }} / {{ totalPages || 1 }}</span>
      <button class="bg-white border px-3 py-1 rounded disabled:opacity-50" (click)="onNextPage()" [disabled]="(query.page || 1) >= totalPages">
        Next
      </button>
    </div>
  </div>

  <app-user-modal
    [user]="selectedUser"
    (save)="onSaveUser($event)"
    (close)="onModalClose()"
    *ngIf="selectedUser"
  ></app-user-modal>
</div>
